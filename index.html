const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){const enc=new TextEncoder();const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:300000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT));return new TextDecoder().decode(pt);}
async function tryPw(pw,remember){const err=document.getElementById("err"),btn=document.getElementById("go");btn.disabled=true;err.textContent="확인 중…";
try{const html=await open(pw);if(remember)try{sessionStorage.setItem("matdaem_pw",pw)}catch(e){}document.open();document.write(html);document.close();}
catch(e){err.textContent="비밀번호가 맞지 않습니다.";btn.disabled=false;}}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();tryPw(document.getElementById("pw").value,true);});
try{const s=sessionStorage.getItem("matdaem_pw");if(s)tryPw(s,false);}catch(e){}
</script></body></html>
